<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espere! Sua compra ainda não está completa</title>
    <meta name="description" content="Assista ao recado antes de concluir sua compra." />
    <style>
      *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#0d202d;color:#fff;font-family:Arial,Helvetica,sans-serif}.page{display:grid;place-items:start center;min-height:100vh;padding:0 0 28px}.vsl-shell{width:min(1025px,100%);min-height:746px;padding:51px 70px 78px;border-radius:0 0 20px 20px;background:#06131c;text-align:center}h1{margin:0 auto 61px;color:#fff;font-size:clamp(31px,4.3vw,48px);font-weight:950;letter-spacing:-.045em;line-height:.92}h1 span{display:table;margin-inline:auto;padding:7px 8px 5px;background:#034dc7}h1 span+span{margin-top:-1px}.video-frame{position:relative;overflow:hidden;width:min(760px,100%);aspect-ratio:16/9;margin-inline:auto;border:2px solid #b8f326;border-radius:12px;background:#fff;box-shadow:0 0 10px rgba(184,243,38,.95),0 0 22px rgba(184,243,38,.22)}.video-placeholder{position:absolute;inset:0;background:#fff}.video-progress{position:absolute;left:0;bottom:0;width:20.5%;height:9px;background:#71419c}.upsell-actions{display:flex;flex-direction:column;gap:24px;align-items:center;width:min(760px,100%);margin:24px auto 0;padding:24px;border-radius:12px;background:#fff;font-family:"DM Sans",Arial,sans-serif;cursor:pointer}.button-default{width:100%}.button-accept{box-shadow:0 8px 20px rgba(52,226,60,.25)}@media(max-width:760px){.page{padding-bottom:0}.vsl-shell{min-height:100vh;padding:42px 18px 60px;border-radius:0}h1{margin-bottom:48px;font-size:clamp(27px,8.2vw,42px);line-height:.98}h1 span{display:inline;padding:3px 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.video-frame{border-radius:9px}.video-progress{height:7px}.upsell-actions{padding:18px}}
    </style>
  </head>
  <body>
    <main class="page">
      <section class="vsl-shell" aria-labelledby="page-title">
        <h1 id="page-title"><span>ESPERE! SUA COMPRA AINDA NÃO</span><span>ESTÁ COMPLETA...</span></h1>
        <div class="video-frame" aria-label="Espaço reservado para o vídeo"><div class="video-placeholder"></div><div class="video-progress"></div></div>
        <div style="font-family: DM Sans; display: flex; flex-direction: column; gap: 24px; align-items: center; cursor: pointer;" class="upsell-actions"><a class="button-default button-accept w-full" style="padding: 17px 32px; line-height: 22px; border-radius: 12px; font-weight: 700 !important; background-color: rgb(52, 226, 60); color: rgb(0, 0, 0); text-decoration: none;" href="https://lastlink.com/p/C84A6065C?cp=PrimeiroMes"> Quero comprar agora! </a><div class="button-default button-deny w-full" style="text-decoration: underline; line-height: 22px; font-size: 16px; font-weight: 700 !important; color: rgb(0, 0, 0);" id="denyButton4deaf72"> Não, Obrigado </div></div>
      </section>
    </main>
    <script>
      function setupDenyButtons() {
        document.querySelectorAll('[id^="denyButton"]').forEach(button => {
          button.onclick = function() {
            const currentUrl = new URL(window.location.href);
            const newUrl = new URL("https://lastlink.com/app/member/dashboardV2");
            currentUrl.searchParams.forEach((value, key) => newUrl.searchParams.append(key, value));
            window.location.href = newUrl.toString();
          };
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupDenyButtons); else setupDenyButtons();
    </script>
  </body>
</html>
